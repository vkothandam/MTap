name: CI

on:
  push:
    branches: [main]
  pull_request:

# No untrusted event input is used in any run: step below.
jobs:
  # Python job: runs on python/ or schemas/ changes.
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'python/**'
              - 'schemas/**'
              - 'shared/**'
      - if: steps.filter.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@v3
      - if: steps.filter.outputs.relevant == 'true'
        run: uv sync --extra dev
      - if: steps.filter.outputs.relevant == 'true'
        run: uv run ruff check .
      - if: steps.filter.outputs.relevant == 'true'
        run: uv run pytest

  # Node job: runs on node/ or schemas/ changes.
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'node/**'
              - 'schemas/**'
              - 'shared/**'
      - if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - if: steps.filter.outputs.relevant == 'true'
        run: npm install
      - if: steps.filter.outputs.relevant == 'true'
        run: npm run lint
      - if: steps.filter.outputs.relevant == 'true'
        run: npm test
