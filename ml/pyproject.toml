[project]
name = "tft-vwap"
version = "0.1.0"
description = "Temporal Fusion Transformer for next-day VWAP, trained on the MTap panel.parquet contract"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pytorch-forecasting>=1.8",
    "lightning>=2.6",
    "torch>=2.2",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
tft-vwap = "tft_vwap.train:main"
tft-vwap-report = "tft_vwap.report:main"
tft-vwap-predict = "tft_vwap.predict:main"
tft-vwap-grade = "tft_vwap.grade:main"
tft-vwap-compare = "tft_vwap.compare:main"
tft-vwap-overlay = "tft_vwap.overlay:main"
tft-intraday = "tft_intraday.train:main"
tft-intraday-report = "tft_intraday.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tft_vwap", "tft_intraday"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
