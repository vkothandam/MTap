[project]
name = "forecast-dash"
version = "0.1.0"
description = "Interactive calibration dashboard for quantile forecast runs (model-agnostic)"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "mtap-space",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
forecast-dash = "forecast_dash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forecast_dash"]
artifacts = ["forecast_dash/space3d/*.js"]

# The 3-D view of Intraday → Space: a st.components.v2 component whose bundled JS
# (built from js/, `npm run build`) Streamlit serves from forecast_dash/space3d/.
[[tool.streamlit.component.components]]
name = "space3d"
asset_dir = "space3d"           # relative to the forecast_dash package

[tool.uv.sources]
mtap-space = { path = "../space", editable = true }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
