[project]
name = "sourcing-py"
version = "0.1.0"
description = "Python sourcers for the MTap sourcing module"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=16",
    "jsonschema>=4.21",
    "selectolax>=0.3",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
# Run a source by name: `sourcing-py run example_api`
sourcing-py = "sourcing_py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sourcing_py"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
