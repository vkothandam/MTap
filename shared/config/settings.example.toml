# Copy to settings.toml and fill in. settings.toml is gitignored — never commit secrets.
# Any value here can also be overridden by an environment variable (see comments).

[storage]
# The two roots. Env MTAP_DATA_ROOT / MTAP_STATE_ROOT win; the repo .env is the usual
# place to set them per machine. Defaults: data = repo root, state = ./state.
# data_root = "/Volumes/mtap/mtap"     # NAS: large write-once parquet
# state_root = "~/mtap-state"          # local: DuckDB, session, logs, unuploaded segments
# nas_url = "smb://user@synology.local/mtap"   # env MTAP_NAS_URL
# Unuploaded feed segments beyond this many GB are reported by `storage check`.
max_local_segments_gb = 20

[destination]
# Base directory for emitted parquet/jsonl output. Relative paths resolve under the
# data root (the repo root unless MTAP_DATA_ROOT is set). Override with env OUT_ROOT.
out_root = "./out"

[intraday]
# Feeds that publish to Redis mtap:evt:INTRADAY_FEED (env INTRADAY_FEEDS, comma list).
feeds = ["etrade_watchlist"]
# Env REDIS_URL.
redis_url = "redis://127.0.0.1:6379"
# Storage consumer (sourcing-py intraday store --follow): rows are buffered for up to
# flush_s seconds / flush_rows rows, fsynced into the open hourly segment, then acked.
flush_s = 5
flush_rows = 20000
# A segment with no new rows for this long is closed and uploaded early.
idle_close_s = 600
# How often a failed NAS upload is retried.
upload_retry_s = 300

[massive]
# Massive.com market-data REST API.
base_url = "https://api.massive.com"
# Override with env MASSIVE_API_KEY (preferred in CI / shared machines).
api_key = "REPLACE_WITH_YOUR_KEY"
# Per-minute request cap for the account (free tier is small, e.g. 5). This budget
# is SHARED across every Massive source via a cross-process throttle, so running
# several Massive programs at once won't exceed it. Raise this on a paid plan.
# Override with env MASSIVE_RATE_LIMIT_PER_MIN.
rate_limit_per_min = 5

[massive_ws]
# Massive per-second bars (sourcing-py massive-ws follow, launchd com.mtap.massive).
# Each key also has an env override, MASSIVE_WS_<KEY upper-cased>.
# ws_url = "wss://delayed.massive.com/stocks"   # 15 min delayed plan
# channels = "A.*"                               # every stock, per-second aggregates
# start_et = "09:00"                             # connect window, NY wall clock, trading days
# stop_et = "16:21"                              # delayed: the 16:00 close arrives ~16:15
# roll_min = 5                                   # one local segment per 5 min of bar time
# flush_s = 5                                    # write batches every 5 s or 50k rows
# flush_rows = 50000
# max_local_gb = 10                              # disconnect if this much is not uploaded yet
# min_free_gb = 20                               # ... or the local disk has less free
# upload_retry_s = 300

[etrade]
# E*TRADE wsod fundamentals REST API (balance sheet, income statement, SEC filings).
# Override with env ETRADE_BASE_URL.
base_url = "https://etrade.api.wsod.com/etrade-api/1.0"
# Throttle target: max stocks/second (each stock = ~7 API calls). Paced via the
# cross-process lock state/rate/etrade.lock. Override with env ETRADE_STOCKS_PER_SEC.
stocks_per_sec = 2
# DuckDB system-of-record for symbols + fundamentals. Relative paths resolve from
# repo root. Override with env ETRADE_DB_PATH.
db_path = "./state/etrade/fundamentals.duckdb"
# Browser session written by the Node E*TRADE login (cookies + stk1/stk2). Phase 2
# `fetch` requires this file. Override with env SESSION_PATH.
session_path = "./state/etrade/session.json"

[news]
# News processing layer (sourcing_py/news): per-symbol RSS aggregation -> local FinBERT
# sentiment -> per-symbol sentiment store. The symbol universe + company names are read
# from the E*TRADE DuckDB above (ATTACHed read-only), so no symbol store is set here.
# DuckDB system-of-record for articles + sentiment. Override with env NEWS_DB_PATH.
db_path = "./state/news/news.duckdb"
# Politeness throttle: max HTTP requests/second (RSS + article fetches share it via the
# cross-process lock state/rate/news.lock). Override with env NEWS_REQUESTS_PER_SEC.
requests_per_sec = 2
# HuggingFace model id for sentiment. First run downloads it into the HF cache (one-time
# network). Override with env NEWS_FINBERT_MODEL.
finbert_model = "ProsusAI/finbert"
# Only keep feed entries published within this many days. Override with env NEWS_LOOKBACK_DAYS.
lookback_days = 30
# Per-request HTTP timeout (seconds).
request_timeout = 30

# Feeds to aggregate. Each is a per-symbol RSS endpoint; {symbol} is substituted per ticker.
#   tag           = which symbol the feed's entries are (tentatively) about ("symbol")
#   fetch_article = true when RSS entries are headline-only and the article body must be
#                   fetched from the entry link and extracted (Yahoo/Google need this);
#                   false when the feed itself carries usable article content.
[[news.feeds]]
name = "yahoo"
url_template = "https://feeds.finance.yahoo.com/rss/2.0/headline?s={symbol}&region=US&lang=en-US"
tag = "symbol"
fetch_article = true

[[news.feeds]]
name = "google"
url_template = "https://news.google.com/rss/search?q={symbol}+stock&hl=en-US&gl=US&ceid=US:en"
tag = "symbol"
fetch_article = true

# Yahoo Finance topic scraper (`sourcing-py news scrape-yahoo`, sourcing_py/news/yahoo.py):
# the stock-market-news topic pages (1..pages; Yahoo keeps 6) -> each article's full text
# with its exact published/modified time. Env overrides: NEWS_YAHOO_<KEY>.
[news.yahoo]
topic_url = "https://finance.yahoo.com/topic/stock-market-news/"
pages = 6
# Yahoo answers the default mtap User-Agent with 429; send a desktop-browser UA.
# user_agent = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) ..."
per_domain_rps = 1
max_concurrency = 3
# Gzipped raw HTML, kept to evaluate the parser later (disposable). Default
# <data root>/news/yahoo/raw.
# raw_dir = "/Volumes/mtap/mtap/news/yahoo/raw"

[edgar]
# SEC EDGAR submissions API (sourcing_py/etrade/edgar.py): 8-K item 2.02 results releases
# with their acceptance time, plus 10-K/10-Q. SEC requires a User-Agent naming you and a
# contact email. Override with env EDGAR_USER_AGENT.
user_agent = "MTap vijayan.kothandaraman@gmail.com"
# SEC caps clients at 10 requests/second (shared via the lock state/rate/sec.lock).
# Override with env EDGAR_REQUESTS_PER_SEC.
requests_per_sec = 8
# Concurrent fetch workers; the throttle above still caps the aggregate rate.
workers = 4
