[package]
name = "massive1s"
version = "0.1.0"
edition = "2024"
description = "Fetch Massive 1-second bars per stock and write agg_1s day files (runs on the NAS; see nas/README.md)"
publish = false

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60.0.0", default-features = false, features = ["ipc_compression"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
flate2 = "1"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
