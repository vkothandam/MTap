[project]
name = "sourcing-py"
version = "0.1.0"
description = "Python sourcers for the MTap sourcing module"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=16",
    "jsonschema>=4.21",
    "selectolax>=0.3",
    "duckdb>=1.0",
    # News processing layer (sourcing_py/news): RSS parsing, main-article extraction,
    # and local FinBERT sentiment. torch is large but the user opted for it as a core dep.
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "transformers>=4.40",
    "torch>=2.2",
    "exchange-calendars>=4.5",
    "redis>=5",
    # Massive per-second aggregates (sourcing_py/massive_ws): the sync client.
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
# Run a source by name: `sourcing-py run example_api`
sourcing-py = "sourcing_py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sourcing_py"]

# Linux (the containers in deploy/container) installs the CPU-only torch wheel: the default
# Linux wheel pulls ~3 GB of CUDA libraries no host here uses. macOS resolves from PyPI as before.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
