# Redis for MTap's bus (com.mtap.redis). Memory only: the stream is a short buffer
# between the feed and the storage consumer, which keeps the durable copy on disk.
bind 127.0.0.1 ::1
port 6379
protected-mode yes
daemonize no
save ""
appendonly no
dir /tmp
# Streams are trimmed by length per event (RedisBus.ts EVENT_MAXLEN), so this is a ceiling,
# not a working size. noeviction: when full, writes fail loudly instead of a stream
# being evicted whole.
maxmemory 2gb
maxmemory-policy noeviction
loglevel notice
